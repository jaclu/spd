#!/bin/sh

#
# If not all files should be deployed list those that should be deployed under
# the destination variable name.
# 
# SPD_FILES_UNIVERSAL_ULB: # ULB = /usr/local/bin destination
#   - myip
#   - network-check
#   - set-timezone
#   - uptime-tracker
#
# If all files in the source should be installed use:
#
# SPD_FILES_UNIVERSAL_ULB: *all*
#

# <spd> files/universal/usr_local_bin -> /usr/local/sbin
SPD_FILES_UNIVERSAL_ULB: *all*

