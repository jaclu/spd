---
# openrc settings
SPD_SVC_OPENRC_RUNLVLS: default # what runlevels it should be started in

#  ---  sysv-init settings  ---
SPD_SVC_SYSV_LVL_START: 2 3 4 5 # what runlevels it should be started in
SPD_SVC_SYSV_LVL_STOP: 0 1 6 # what runlevels it should be stopped in
SPD_SVC_SYSV_LVL_RUN_TASK: 9 # What order to run the task in, if it should
SPD_SVC_SYSV_LVL_KILL_TASK: 1 # What order to kill the task in, if it should

# autossh settings
SPD_SVC_AUTOSSH_RUNLVL: boot sysinit default nonetwork # only relevant for openrc

SPD_SVC_AUTOSSH_KEY_FILE: "/home/{{ SPD_UNAME }}/.ssh/id_jumpy"
SPD_SVC_AUTOSSH_JUMP_HOST: jumpy
SPD_SVC_AUTOSSH_JUMP_PORT: 2942
