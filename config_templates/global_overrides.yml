---
#
# This should be the last config file read, so here we can override any settings
# from other config files, to match personal preferences, without having to mess around
# if the base configs are changed/updated and manually apply user preferences again.
#

# In my case i reduce the FS deploys to increase test turnarround times

# SPD_APK_REMOVE: tzdata
SPD_aAPK_INSTALL:
  - bash # The GNU Bourne Again shell
  - bash-completion # Command-line tab-completion for bash
  - mg
  - ripgrep
  - openrc
  - autossh
  - musl-locales # Locales support for musl
  - tzdata
  - procps

SPD_DEBIAN_APT_PURGE: emacs-nox
SPD_DEBIAN_APT_INSTALL:
  - bash # The GNU Bourne Again shell
  - bash-completion # Command-line tab-completion for bash
  - mg
  - ripgrep
  - autossh
  - locales # Locales support
  - tzdata # Timezone data

SPD_DEVUAN_APT_PURGE: openrc
SPD_DEVUAN_APT_INSTALL:
  - bash-completion # Command-line tab-completion for bash
  - zsh # Very advanced and programmable command interpreter (shell)
  - autossh
  - tzdata

# SPD_PKGS_MAN: true # If set to 1 man pages will be deployed
SPD_PKGS_DEVEL: false # If set to 1 development packages will be deployed
SPD_PKGS_LINTING: false # If set to 1 linting packages will be deployed


# SPD_SERVICE_HANDLER: openrc
# SPD_SERVICE_HANDLER: sysv-init

# SPD_ACTIVE_PURGE_DISABLED_PACKAGES: true
# SPD_DEBUG_LEVEL: 0
