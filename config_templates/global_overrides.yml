---
#
# This should be the last config file read, so here we can override any settings
# from other config files, to match personal preferences, without having to mess around
# if the base configs are changed/updated and manually apply user preferences again.
#

#
# In my case i reduce the FS deploys to increase test turnarround times
# only using the minim to get the deploy through
#

# SPD_ABORT: 2

# mostly a debug feature, if enabled copy_items() refuses to overwrite existing files
SPD_NO_FILE_COPY_REPLACEMENTS: true

# SPD_APK_REMOVE:
SPD_APK_INSTALL:
  # - bash # The GNU Bourne Again shell
  - openrc
  - autossh
  # - procps

# SPD_APK_DEVEL:
# SPD_APK_LINTING:

# SPD_APT_PURGE:
SPD_APT_INSTALL: openrc autossh
# SPD_APT_DEVEL:
# SPD_APT_LINTING:

# SPD_APT_PURGE:

# SPD_FILES_UNIVERSAL_ULB: myip
# SPD_FILES_ALPINE_ULB: Mapk
# SPD_FILES_DEBIAN_ULB: Mapt
# SPD_FILES_DEVUAN_ULB: Mapt-dummy
# SPD_FILES_ISH_ULB: logger
# SPD_FILES_ISH_ULSB: halt
# SPD_FILES_ISH_AOK_ULB: elock
# SPD_FILES_ISH_NOT_AOK_ULB: uptime
# SPD_FILES_ISH_ALPINE_ULB: apk-find-pkg
# SPD_FILES_ISH_DEBIAN_ULB: idev_ip
# SPD_FILES_ISH_DEBIAN_ULSB: fake-init
# SPD_FILES_ISH_DEVUAN_ULB: console-restart
# SPD_FILES_ISH_DEVUAN_ULSB: kill_tail_logging

# Forced on
# SPD_PKGS_MAN: true # If set to 1 man pages will be deployed
# SPD_PKGS_DEVEL: true # If set to 1 development packages will be deployed
# SPD_PKGS_LINTING: true # If set to 1 linting packages will be deployed
# Forced off
# SPD_PKGS_MAN: false
# SPD_PKGS_DEVEL: false
# SPD_PKGS_LINTING: false

# SPD_ACTIVE_PURGE_DISABLED_PACKAGES: true
# SPD_ACTIVE_PURGE_DISABLED_PACKAGES: false

# Always use this service handler
# SPD_SERVICE_HANDLER: openrc
# # SPD_SERVICE_HANDLER: sysv-init

# SPD_DEBUG_LEVEL: 0 # no output
